[package]
name = "genarch"
version = "0.3.1"
edition = "2024"
description = "Native tuning engine for one Arch host: layered intent, profiles, checks, convergence"
license = "MIT"
repository = "https://github.com/ZhangDM-520/genarch-settings"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
regex = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
