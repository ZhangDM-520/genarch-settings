[package]
name = "genarch"
version = "0.1.0"
edition = "2024"
description = "Native tuning engine for one Arch host: intent, checks, convergence"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
regex = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
