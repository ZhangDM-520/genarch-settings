# Phoenix is one core type (Zen 4 with SMT), so a frequency band covers every policy.
#
# Both SKUs share one DMI product string: 5.1 GHz (7840HS) and 5.2 GHz (7940HS). The band rule
# takes the highest declared clock the machine actually admits, so a 7840HS is capped at 5.1 and
# a 7940HS at 5.2 — one profile, no needless capping, and never a ceiling above what the kernel
# will accept. A band applies by `cpuinfo_max_freq`, not by CPU numbering, because this
# machine's numbering was never observed here.
[[class]]
name = "7840hs"
khz = 5100000

[[class]]
name = "7940hs"
khz = 5200000
