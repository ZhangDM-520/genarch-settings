# Hawk Point: one core type (Zen 4, SMT). Both CPU variants are single-core max boosts from AMD's
# own pages, and the highest band a unit admits is its own ceiling — so a 8845HS unit is capped at
# 5.1 GHz and a 8945HS at 5.2, never a value above what the kernel reports.
#
# The dGPU's TGP is a separate power domain and is not a CPU ceiling.
[[class]]
name = "8945hs"
khz = 5200000

[[class]]
name = "8845hs"
khz = 5100000
