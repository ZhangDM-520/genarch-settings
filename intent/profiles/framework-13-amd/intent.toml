# Framework Laptop 13, AMD (Ryzen 7040 series mainboard).
#
# The 7640U and 7840U share one product string but ship on different boards and boost to
# different clocks. One profile covers both because a ceiling band is a *clock*: each unit takes
# the highest band it admits, so the 7640U is capped at 4.9 GHz (its own maximum) and the 7840U
# at 5.1 GHz. Splitting by board would be two profiles for one tuning rule.
#
# Framework's own detection also accepts a spaced spelling ("Laptop 13 (AMD Ryzen 7040 Series)")
# that no probe in the DMI dataset shows; the engine's `[requires]` is exact equality, so a unit
# reporting the spaced form would need its own profile rather than a looser match.
#
# Documented, not measured (`docs/PROFILES.md`).
status = "documented"
source = [
  "https://raw.githubusercontent.com/linuxhw/DMI/master/Notebook/Framework/Laptop/Laptop%2013/00D34731EF59",
  "https://github.com/FrameworkComputer/framework-system/blob/main/framework_lib/src/smbios.rs",
  "https://www.amd.com/en/products/processors/laptop/ryzen/7000-series/amd-ryzen-7-7840u.html",
  "https://www.amd.com/en/products/processors/laptop/ryzen/7000-series/amd-ryzen-5-7640u.html",
]

[requires]
product = "Laptop 13 (AMD Ryzen 7040Series)"
sys_vendor = "Framework"
